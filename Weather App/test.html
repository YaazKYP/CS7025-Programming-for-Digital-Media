<!DOCTYPE html>
<html lang="en">

    <head>
<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather Today</title>
        <link rel="stylesheet" href="styletest.css">
        <script src="test.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body class="weatherPage">
        <main class="weatherCard">
            <h1 class="weatherCardTitle">Bangkok</h1>
            <p class="temperature" id="temperature">--°C</p>
            <p class="condition" id="condition"></p>

            <div class="weatherDetails">
                <div>
                    <p class="detailLabel">Humidity</p>
                    <p class="detailValue" id="humidity">--%</p>
                </div>
                <div>
                    <p class="detailLabel">Wind Speed</p>
                    <p class="detailValue" id="wind-speed">-- mph</p>
                </div>
            </div>
        </main>


         <main class="weatherCard">
            <h1 class="weatherCardTitle">Dublin</h1>
            <p class="temperature" id="temperature2">--°C</p>
            <p class="condition" id="condition2"></p>

            <div class="weatherDetails">
                <div>
                    <p class="detailLabel">Humidity</p>
                    <p class="detailValue" id="humidity2">--%</p>
                </div>
                <div>
                    <p class="detailLabel">Wind Speed</p>
                    <p class="detailValue" id="wind-speed2">-- mph</p>
                </div>
            </div>
        </main>

    </body>
</html>
